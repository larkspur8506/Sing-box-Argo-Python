name: build-arm64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build linux/arm64
        run: |
          set -e
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o main-arm64 main.go
          ls -l main-arm64
          sha256sum main-arm64 | tee main-arm64.sha256

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create arm64 --title "arm64 build" --notes "Auto-built linux/arm64 binary of main.go" || true
          gh release upload arm64 main-arm64 main-arm64.sha256 --clobber
          gh release view arm64 --json assets --jq '.assets[].name'
